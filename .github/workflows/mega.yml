name: MEGA BOT V3 NEWS FILTER
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install yfinance pandas websockets requests
      - run: python mega_bot.py
      - name: Save stats
        run: |
          git config user.name "bot"
          git config user.email "bot@fxmega.ug"
          git add stats.json || true
          git commit -m "update stats" || true
          git push || true
