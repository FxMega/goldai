name: Gold AI Every 15min
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt || pip install requests
      - name: Run Gold Bot
        run: |
          ls -la
          FILE=$(ls *.py 2>/dev/null | head -1)
          if [ -z "$FILE" ]; then FILE=$(find . -name "*.py" | head -1); fi
          echo "Found file: $FILE"
          python "$FILE"
