name: Gold AI Every 15min
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt || pip install requests yfinance
      - name: Run Gold Bot
        run: |
          ls -la
          # Rename your file if it has space or no .py
          if [ -f "Gold AI" ]; then mv "Gold AI" gold.py; fi
          if ls Gold* 1> /dev/null 2>&1; then mv Gold* gold.py || true; fi
          if ls G* 1> /dev/null 2>&1; then mv G* gold.py || true; fi
          ls -la
          echo "Running gold.py"
          python gold.py
